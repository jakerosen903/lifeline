name: PR checks

# Every pull request runs, in this order:
#   1. guards        — deterministic checks for the things that can lose a
#                      person's data (edited shipped migration, column without a
#                      migration, destructive SQL, new network host, real
#                      phone/email in fixtures, API key or device ID in the diff)
#   2. kit-tests     — `swift test` for LifelineKit on a macOS runner
#   3. claude-review — the Lifeline-specific review (.github/claude-review.md),
#                      which runs after 1–2 and reports their results in its
#                      summary comment.
#
# Edit .github/claude-review.md to change how the review reads or what it checks.
# Edit .github/scripts/pr_guards.py to change the deterministic guards.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guards:
    name: Guards (migrations, posture, fixtures, secrets)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guards
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch -q origin "${{ github.event.pull_request.base.ref }}"
          python3 .github/scripts/pr_guards.py "origin/${{ github.event.pull_request.base.ref }}"

  kit-tests:
    name: Kit tests (swift test)
    if: github.event.pull_request.draft == false
    # LifelineKit targets macOS 26 (SpeechAnalyzer, GRDB 7). Linux cannot build it.
    runs-on: macos-26
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios/LifelineKit
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: swift test
        run: swift test 2>&1 | tee swift-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: ios/LifelineKit/swift-test.log
          retention-days: 7

  claude-review:
    name: Claude review
    needs: [guards, kit-tests]
    # Always review, even when a check failed — the review reports the failure.
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the reviewer can diff against the base branch and
          # read the registered migrations as they were before the PR.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            CI RESULTS FROM THIS RUN (job → result):
              guards: ${{ needs.guards.result }}
              kit-tests: ${{ needs.kit-tests.result }}
            CI RUN ID: ${{ github.run_id }}

            Read `.github/claude-review.md` and follow it exactly. It defines the
            writing style, the summary comment structure, the principle and
            migration checks, and what counts as a finding.

            Steps:
            1. Read `CLAUDE.md`, `.github/claude-review.md`, and the "Principles"
               and "Design implications" sections of `docs/PRINCIPLES.md`.
            2. Get the PR title and description: `gh pr view ${{ github.event.pull_request.number }} --json title,body,files`.
            3. Get the full diff: `gh pr diff ${{ github.event.pull_request.number }}`.
            4. Open every changed file in full, plus any file it calls on a
               store, network, confirmation, or fixed-response path, so you judge
               the real blast radius and not just the hunks.
            5. For the migration check, diff `ios/LifelineKit/Sources/LifelineKit/Store/Migrations.swift`
               and `ios/LifelineKit/Tests/LifelineKitTests/MigrationsTests.swift`
               against `origin/${{ github.event.pull_request.base.ref }}`.
            6. For the data-posture check, diff every file under
               `ios/LifelineKit/Sources/LifelineKit/Extraction/` and `Secrets/`
               against the base branch, and grep the diff for `print(`, `Logger`,
               `os_log`, `URLSession`, and `UserDefaults`.
            7. If any CI job above is not `success`, read why with
               `gh run view ${{ github.run_id }} --log-failed` and quote the
               failing test names or guard lines in the Tests section. A failed
               guard, or a failed store, actions, or fixed-response test, is a
               "Do not merge".
            8. Write the summary to a temp file so formatting survives, then
               post it so there is only ever one summary comment per PR:
               `gh pr comment ${{ github.event.pull_request.number }} --body-file <file> --edit-last --create-if-none`.
               If `--create-if-none` is not supported by this gh version, run
               `--edit-last` first and, if it reports no comment to edit, post
               without `--edit-last`.
            9. Post one inline comment per real defect with the inline comment tool.
          claude_args: |
            --allowedTools "Read,Grep,Glob,LS,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),Bash(grep:*)"
