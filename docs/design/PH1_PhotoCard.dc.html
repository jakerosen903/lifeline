<x-dc>
<helmet>

</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F0E4; color: #332A23; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 64px 24px 0 24px; display: flex; align-items: center; justify-content: space-between">

    </a>
    <div style="font-size: 14px; font-weight: 600">A story about a photo</div>
    <div style="width: 44px"></div>
  </div>

  <div style="flex: 1; padding: 14px 20px 0 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

    <div style="display: flex; gap: 14px; align-items: center">
      <div role="img" aria-label="The photo this story is about" style="width: 104px; height: 78px; border-radius: 12px; background: #C8A56B; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #4A3413">the photo</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 13px; color: #6B6053">taken 14 June 2012</div>
        <a href="#" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 500; text-decoration: none; color: #332A23">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6053" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E3D8C3; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 19px">Also show this photo on</div>
        <div style="font-size: 13px; color: #6B6053">Tap to add. Tap again to take it off.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6053">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6053" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          People
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" aria-pressed="true" style="all: unset; cursor: pointer; min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 22px; background: #5F7046; color: #FFFFFF; font-size: 15px; font-weight: 600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
            Maya
          </button>
          <button type="button" aria-pressed="false" style="all: unset; cursor: pointer; box-sizing: border-box; min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 22px; border: 1.5px solid #5F7046; color: #3F4C2E; font-size: 15px; font-weight: 500">Dad</button>
          <button type="button" aria-pressed="false" style="all: unset; cursor: pointer; box-sizing: border-box; min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 22px; border: 1.5px solid #5F7046; color: #3F4C2E; font-size: 15px; font-weight: 500">Aunt Rosa</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6053">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6053" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.800 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/></svg>
          Places
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" aria-pressed="false" style="all: unset; cursor: pointer; box-sizing: border-box; min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 22px; border: 1.5px solid #5F7046; color: #3F4C2E; font-size: 15px; font-weight: 500">Pelican Beach</button>
          <button type="button" aria-pressed="false" style="all: unset; cursor: pointer; box-sizing: border-box; min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 22px; border: 1.5px solid #5F7046; color: #3F4C2E; font-size: 15px; font-weight: 500">The cabin</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6053">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6053" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
          Things
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" aria-pressed="false" style="all: unset; cursor: pointer; box-sizing: border-box; min-height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 22px; border: 1.5px solid #5F7046; color: #3F4C2E; font-size: 15px; font-weight: 500">The blue kayak</button>
        </div>
      </div>
    </div>

    <div style="background: #FBF4E6; border: 1px solid #E6CFA6; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 19px">When did this happen?</div>
      <div style="font-size: 14px; line-height: 1.45; color: #4A4037">The photo is dated 14 June 2012. Three moments have no date you said.</div>
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
        <button type="button" style="all: unset; cursor: pointer; min-height: 44px; padding: 0 18px; display: flex; align-items: center; border-radius: 22px; background: #5F7046; color: #FFFFFF; font-size: 15px; font-weight: 600">Use for those 3</button>
        <a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 500; text-decoration: none">Choose moments</a>
      </div>
    </div>
  </div>

  <div style="padding: 4px 24px 30px 24px; display: flex; justify-content: center">
    <button type="button" style="all: unset; cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 14px; color: #8A3B2A">Remove the photo from this story</button>
  </div>
</div>
</x-dc>
