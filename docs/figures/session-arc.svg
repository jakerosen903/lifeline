<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-label="Session arc over 60 minutes: open for the first few minutes, middle until about minute 45, wind-down for the last 10 minutes; an early wind-down can start at any time on a signal.">
<g font-size="12" fill="#332A23" fill-opacity=".7">
<text x="40" y="150" text-anchor="middle">0</text>
<text x="190" y="150" text-anchor="middle">15</text>
<text x="340" y="150" text-anchor="middle">30</text>
<text x="490" y="150" text-anchor="middle">45</text>
<text x="620" y="150" text-anchor="middle">60 min</text>
</g>
<rect x="40" y="50" width="50" height="34" rx="6" fill="#5F7046" fill-opacity=".25"/>
<rect x="90" y="50" width="420" height="34" rx="6" fill="#5F7046" fill-opacity=".5"/>
<rect x="510" y="50" width="110" height="34" rx="6" fill="#C8893F"/>
<g font-size="12" font-weight="600" fill="#332A23">
<text x="65" y="72" text-anchor="middle">Open</text>
<text x="300" y="72" text-anchor="middle">Middle · reflections, follow-ups, at most one door</text>
</g>
<text x="565" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#332A23">Wind-down</text>
<path d="M260 110 L260 88" stroke="#C8893F" stroke-width="2" stroke-dasharray="3 3"/>
<rect x="260" y="92" width="110" height="0"/>
<text x="260" y="126" font-size="11" fill="#8A5A1E">early wind-down on a signal</text>
<text x="260" y="140" font-size="11" fill="#332A23" fill-opacity=".7">(asks to stop · long silence after a heavy topic · crying)</text>
<text x="40" y="36" font-size="11" fill="#332A23" fill-opacity=".7">No new doors after a heavy moment. The last 10 minutes: summary in their words, keep / private / let go, one light question.</text>
</svg>