<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="290" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 760 290" role="img" aria-label="How tellings become one memory and memories a story. While you talk: a segment goes to the extractor and matcher, which produce a card that is new, grows, or asks Same as X. After a Keep: the nearest kept memories go to the reconciler in one batch, which produces pair cards. Both routes end at your call: Same story merges with one Undo; Keep separate is never asked again; Part of X joins a story."><defs><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#332A23"/></marker></defs><text x="20" y="34" font-size="11" font-weight="600" fill="#332A23" fill-opacity=".7">WHILE YOU TALK</text><rect x="20" y="48" width="110" height="46" rx="8" fill="none" stroke="#332A23"/><text x="75" y="68" text-anchor="middle" font-size="12" fill="#332A23">Segment</text><text x="75" y="83" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">1.8 s pause</text><rect x="158" y="48" width="180" height="46" rx="8" fill="none" stroke="#332A23"/><text x="248" y="68" text-anchor="middle" font-size="12" fill="#332A23">Extractor + matcher</text><text x="248" y="83" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">related moments in the packet</text><rect x="366" y="48" width="160" height="46" rx="8" fill="none" stroke="#332A23"/><text x="446" y="68" text-anchor="middle" font-size="12" fill="#332A23">Card</text><text x="446" y="83" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">new · grows · “Same as X?”</text><text x="20" y="134" font-size="11" font-weight="600" fill="#332A23" fill-opacity=".7">AFTER A KEEP</text><rect x="20" y="148" width="110" height="46" rx="8" fill="none" stroke="#332A23"/><text x="75" y="168" text-anchor="middle" font-size="12" fill="#332A23">Keep</text><text x="75" y="183" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">or at launch</text><rect x="158" y="148" width="180" height="46" rx="8" fill="none" stroke="#332A23"/><text x="248" y="168" text-anchor="middle" font-size="12" fill="#332A23">Nearest kept memories</text><text x="248" y="183" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">top 3 · cosine ≥ 0.55</text><rect x="366" y="148" width="160" height="46" rx="8" fill="none" stroke="#332A23"/><text x="446" y="168" text-anchor="middle" font-size="12" fill="#332A23">Reconciler</text><text x="446" y="183" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">batch of 20 · pair cards</text><text x="660" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#8A5A1E">YOUR CALL</text><rect x="580" y="32" width="162" height="44" rx="8" fill="none" stroke="#5F7046"/><text x="661" y="51" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Same story</text><text x="661" y="66" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">one memory · one Undo</text><rect x="580" y="104" width="162" height="44" rx="8" fill="none" stroke="#332A23"/><text x="661" y="123" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Keep separate</text><text x="661" y="138" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">never asked again</text><rect x="580" y="176" width="162" height="44" rx="8" fill="none" stroke="#C8893F"/><text x="661" y="195" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Part of: X</text><text x="661" y="210" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">joins a story · or not</text><g stroke="#332A23" stroke-width="1.4" fill="none"><path d="M526 71 H553"/><path d="M526 171 H553"/><line x1="553" y1="54" x2="553" y2="198"/></g><g stroke="#332A23" stroke-width="1.4" fill="none" marker-end="url(#ao)"><line x1="130" y1="71" x2="156" y2="71"/><line x1="338" y1="71" x2="364" y2="71"/><line x1="130" y1="171" x2="156" y2="171"/><line x1="338" y1="171" x2="364" y2="171"/><line x1="553" y1="54" x2="578" y2="54"/><line x1="553" y1="126" x2="578" y2="126"/><line x1="553" y1="198" x2="578" y2="198"/></g><line x1="20" y1="240" x2="742" y2="240" stroke="#332A23" stroke-opacity=".2"/><text x="20" y="262" font-size="11" fill="#332A23" fill-opacity=".8">Nothing merges, groups or is retitled without a tap. A merge keeps every telling’s audio;</text><text x="20" y="278" font-size="11" fill="#332A23" fill-opacity=".8">“Separate this telling” undoes it at any time. A memory excluded from AI is never matched.</text></svg>