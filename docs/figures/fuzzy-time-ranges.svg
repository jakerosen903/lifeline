<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="240" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 640 240" role="img" aria-label="A memory's time range narrowing in three steps: a wide possible band from 1996 to 2023, narrowed to 1996 to 2002 by 'Maya was little', then to 1999 to 2001 by 'after the station wagon died'.">
      <g font-size="12" fill="#332A23" fill-opacity=".7">
        <text x="110" y="226" text-anchor="middle">1996</text>
        <text x="235" y="226" text-anchor="middle">2003</text>
        <text x="360" y="226" text-anchor="middle">2010</text>
        <text x="485" y="226" text-anchor="middle">2017</text>
        <text x="592" y="226" text-anchor="middle">2023</text>
      </g>
      <line x1="110" y1="30" x2="110" y2="212" stroke="#332A23" stroke-opacity=".15"/>
      <line x1="592" y1="30" x2="592" y2="212" stroke="#332A23" stroke-opacity=".15"/>
      <!-- row 1 -->
      <text x="12" y="52" font-size="12" font-weight="600" fill="#332A23">Collection span</text>
      <rect x="110" y="42" width="482" height="12" rx="6" fill="#EAD2AC"/>
      <text x="351" y="34" text-anchor="middle" font-size="11" fill="#8A5A1E">“Family trips to Yosemite” · 14 memories</text>
      <!-- row 2 -->
      <text x="12" y="112" font-size="12" font-weight="600" fill="#332A23">“Maya was little”</text>
      <rect x="110" y="102" width="482" height="12" rx="6" fill="#EAD2AC" fill-opacity=".45"/>
      <rect x="110" y="102" width="107" height="12" rx="6" fill="#C8893F"/>
      <text x="163" y="94" text-anchor="middle" font-size="11" fill="#8A5A1E">likely 1996–2002</text>
      <!-- row 3 -->
      <text x="12" y="172" font-size="12" font-weight="600" fill="#332A23">“After the wagon died”</text>
      <rect x="110" y="162" width="482" height="12" rx="6" fill="#EAD2AC" fill-opacity=".45"/>
      <rect x="163" y="162" width="36" height="12" rx="6" fill="#C8893F"/>
      <text x="181" y="154" text-anchor="middle" font-size="11" fill="#8A5A1E">likely 1999–2001</text>
      <path d="M163 120 L163 158" stroke="#332A23" stroke-opacity=".4" stroke-dasharray="3 3"/>
      <path d="M217 120 L199 158" stroke="#332A23" stroke-opacity=".4" stroke-dasharray="3 3"/>
      <text x="420" y="178" font-size="11" fill="#332A23" fill-opacity=".7">possible band stays until the person says otherwise</text>
    </svg>