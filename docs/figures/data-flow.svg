<?xml version="1.0" encoding="UTF-8"?>
<svg width="770" height="404" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 770 404" role="img" aria-label="V1 data flow. On the iPhone: microphone, one capture tap, on-device speech-to-text and a segmenter write to the local store. On-device embeddings and the context packet builder read the store; the sorting worker sends a segment and packet, text only, to the Anthropic Messages API, which keeps nothing. Candidates and verdicts come back as cards; kept memories go to the resolver and the timeline."><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#332A23"/></marker></defs><rect x="12" y="20" width="548" height="314" rx="12" fill="none" stroke="#332A23" stroke-opacity=".35" stroke-dasharray="5 4"/><text x="26" y="40" font-size="11" font-weight="600" fill="#332A23" fill-opacity=".7">IPHONE · keeps all data</text><rect x="584" y="20" width="174" height="314" rx="12" fill="none" stroke="#C8893F" stroke-width="1.5" stroke-dasharray="5 4"/><text x="598" y="40" font-size="11" font-weight="600" fill="#8A5A1E">ANTHROPIC API</text><text x="598" y="55" font-size="10" fill="#8A5A1E">stateless · keeps nothing</text><rect x="30" y="58" width="90" height="40" rx="8" fill="none" stroke="#332A23"/><text x="75" y="82" text-anchor="middle" font-size="12" fill="#332A23">Microphone</text><rect x="144" y="58" width="120" height="40" rx="8" fill="none" stroke="#332A23"/><text x="204" y="75" text-anchor="middle" font-size="12" fill="#332A23">Capture</text><text x="204" y="90" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">one tap, one clock</text><rect x="288" y="58" width="140" height="40" rx="8" fill="none" stroke="#332A23"/><text x="358" y="75" text-anchor="middle" font-size="12" fill="#332A23">Speech-to-text</text><text x="358" y="90" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">on device · word times</text><rect x="452" y="58" width="90" height="40" rx="8" fill="none" stroke="#332A23"/><text x="497" y="75" text-anchor="middle" font-size="12" fill="#332A23">Segmenter</text><text x="497" y="90" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">1.8 s pause</text><rect x="30" y="126" width="512" height="32" rx="8" fill="#332A23" fill-opacity=".06" stroke="#332A23" stroke-opacity=".5"/><text x="286" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#332A23">Local store · SQLite + audio · moments, stories, people, vectors</text><rect x="30" y="190" width="150" height="42" rx="8" fill="none" stroke="#332A23"/><text x="105" y="208" text-anchor="middle" font-size="12" fill="#332A23">On-device embeddings</text><text x="105" y="223" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">nearest kept moments</text><rect x="212" y="190" width="166" height="42" rx="8" fill="none" stroke="#332A23"/><text x="295" y="208" text-anchor="middle" font-size="12" fill="#332A23">Context packet</text><text x="295" y="223" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">related · 6,000-token cap</text><rect x="410" y="190" width="132" height="42" rx="8" fill="none" stroke="#332A23"/><text x="476" y="208" text-anchor="middle" font-size="12" fill="#332A23">Sorting worker</text><text x="476" y="223" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">durable · restartable</text><rect x="30" y="272" width="120" height="42" rx="8" fill="#5F7046" fill-opacity=".14" stroke="#5F7046"/><text x="90" y="290" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Timeline</text><text x="90" y="305" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">stories · shelf</text><rect x="190" y="272" width="130" height="42" rx="8" fill="none" stroke="#332A23"/><text x="255" y="290" text-anchor="middle" font-size="12" fill="#332A23">Resolver</text><text x="255" y="305" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">anchors → ranges</text><rect x="360" y="272" width="182" height="42" rx="8" fill="none" stroke="#332A23"/><text x="451" y="290" text-anchor="middle" font-size="12" fill="#332A23">Cards · your call</text><text x="451" y="305" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">Keep · Change · Same story</text><rect x="600" y="170" width="142" height="52" rx="8" fill="none" stroke="#C8893F"/><text x="671" y="193" text-anchor="middle" font-size="12" fill="#332A23">Extractor v5</text><text x="671" y="208" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">moments · anchors · refs</text><rect x="600" y="248" width="142" height="52" rx="8" fill="none" stroke="#C8893F"/><text x="671" y="271" text-anchor="middle" font-size="12" fill="#332A23">Reconciler v1</text><text x="671" y="286" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">same moment? story?</text><rect x="584" y="346" width="174" height="48" rx="10" fill="none" stroke="#332A23" stroke-opacity=".5" stroke-dasharray="4 3"/><text x="671" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#332A23">Later</text><text x="671" y="382" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">Swift server · interviewer</text><g stroke="#332A23" stroke-width="1.4" fill="none" marker-end="url(#af)"><line x1="120" y1="78" x2="142" y2="78"/><line x1="264" y1="78" x2="286" y2="78"/><line x1="428" y1="78" x2="450" y2="78"/><line x1="204" y1="98" x2="204" y2="124"/><line x1="497" y1="98" x2="497" y2="124"/><line x1="105" y1="158" x2="105" y2="188"/><line x1="295" y1="158" x2="295" y2="188"/><line x1="476" y1="158" x2="476" y2="188"/><line x1="180" y1="211" x2="210" y2="211"/><line x1="378" y1="211" x2="408" y2="211"/><line x1="542" y1="200" x2="598" y2="200"/><line x1="600" y1="293" x2="544" y2="293"/><line x1="360" y1="293" x2="322" y2="293"/><line x1="190" y1="293" x2="152" y2="293"/></g><g font-size="10" fill="#332A23" fill-opacity=".75"><text x="210" y="116">audio file</text><text x="503" y="116">segments</text><text x="111" y="178">kept</text><text x="301" y="178">people · pending cards</text><text x="482" y="178">pending</text><text x="570" y="193" text-anchor="middle">text only</text><text x="341" y="286" text-anchor="middle">kept</text><text x="171" y="286" text-anchor="middle">ranges</text><text x="572" y="286" text-anchor="middle">cards</text></g></svg>