<svg width="720" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 720 360" role="img" aria-label="Data model. Memory at the center: title, quote, earliest, latest, likely, origin, two privacy flags, an on-device embedding. On the left: tellings (audio spans in sessions), people, places. On the right: story, chapter, collection. Below: anchors, typed edges such as before, after, during, an age or a stated date."><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#332A23"/></marker></defs><rect x="250" y="110" width="220" height="134" rx="10" fill="#5F7046" fill-opacity=".14" stroke="#5F7046" stroke-width="1.5"/><text x="360" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#332A23" fill-opacity="1">Memory</text><text x="360" y="151" text-anchor="middle" font-size="11" font-weight="400" fill="#332A23" fill-opacity="1">title · quote</text><text x="360" y="169" text-anchor="middle" font-size="11" font-weight="400" fill="#332A23" fill-opacity="1">earliest · latest · likely · origin</text><text x="360" y="187" text-anchor="middle" font-size="11" font-weight="400" fill="#332A23" fill-opacity="1">hidden from timeline · excluded from AI</text><text x="360" y="205" text-anchor="middle" font-size="11" font-weight="400" fill="#332A23" fill-opacity="1">embedding (on device)</text><text x="360" y="223" text-anchor="middle" font-size="10" font-weight="400" fill="#332A23" fill-opacity="0.7">a range, never a point</text><rect x="30" y="40" width="160" height="56" rx="8" fill="none" stroke="#332A23"/><text x="110" y="65" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Tellings</text><text x="110" y="80" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">audio spans in sessions</text><rect x="30" y="132" width="160" height="56" rx="8" fill="none" stroke="#332A23"/><text x="110" y="157" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Person</text><text x="110" y="172" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">name · aliases</text><rect x="30" y="224" width="160" height="56" rx="8" fill="none" stroke="#332A23"/><text x="110" y="249" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Place</text><text x="110" y="264" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">the person’s words</text><rect x="530" y="40" width="160" height="56" rx="8" fill="none" stroke="#C8893F"/><text x="610" y="65" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Story</text><text x="610" y="80" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">related memories</text><rect x="530" y="132" width="160" height="56" rx="8" fill="none" stroke="#332A23"/><text x="610" y="157" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Chapter</text><text x="610" y="172" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">titled by the person</text><rect x="530" y="224" width="160" height="56" rx="8" fill="none" stroke="#C8893F"/><text x="610" y="249" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Collection</text><text x="610" y="264" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">a theme across chapters</text><g stroke="#332A23" stroke-width="1.3" fill="none" marker-end="url(#am)"><path d="M250 132 H220 V68 H192"/><line x1="250" y1="160" x2="192" y2="160"/><path d="M250 222 H220 V252 H192"/><path d="M470 132 H500 V68 H528"/><line x1="470" y1="160" x2="528" y2="160"/><path d="M470 222 H500 V252 H528"/><path d="M400 244 V290 H320 V246"/></g><g font-size="10" fill="#332A23" fill-opacity=".75"><text x="221" y="61" text-anchor="middle" font-size="9.5">told in (1+)</text><text x="221" y="153" text-anchor="middle" font-size="9.5">present (0+)</text><text x="221" y="267" text-anchor="middle" font-size="9.5">at (0–1)</text><text x="499" y="61" text-anchor="middle" font-size="9.5">in (0–1)</text><text x="499" y="153" text-anchor="middle" font-size="9.5">in (0–1)</text><text x="499" y="267" text-anchor="middle" font-size="9.5">member (0+)</text><text x="360" y="308" text-anchor="middle">anchor: before · after · during · same year as · age · stated</text></g><text x="360" y="340" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".6">Also stored: sessions, segments, words, candidates (never edited), mentions, curiosity items, duplicate pairs, profile</text></svg>