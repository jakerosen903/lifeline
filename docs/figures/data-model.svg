<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="372" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 720 372" role="img" aria-label="Data model after M7. Memory at the center: title, quote, a kind (event, other, fact, feeling, goal), a range with its origin, two privacy flags and an on-device embedding. On the left: tellings (audio spans in sessions), entities (person, place, thing, idea) linked as a detail or a mention, and free-text domain tags. On the right: story, chapter, collection. Below: anchors, typed edges such as before, after, during, an age or a stated date."><defs><marker id="am2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#332A23"/></marker></defs><rect x="240" y="104" width="240" height="152" rx="10" fill="#5F7046" fill-opacity=".14" stroke="#5F7046" stroke-width="1.5"/><text x="360" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#332A23" fill-opacity="1">Memory</text><text x="360" y="146" text-anchor="middle" font-size="11" font-weight="400" fill="#332A23" fill-opacity="1">title · quote</text><text x="360" y="165" text-anchor="middle" font-size="10.5" font-weight="400" fill="#332A23" fill-opacity="1">kind: event · other · fact · feeling · goal</text><text x="360" y="184" text-anchor="middle" font-size="11" font-weight="400" fill="#332A23" fill-opacity="1">earliest · latest · likely · origin</text><text x="360" y="203" text-anchor="middle" font-size="11" font-weight="400" fill="#332A23" fill-opacity="1">hidden from timeline · excluded from AI</text><text x="360" y="222" text-anchor="middle" font-size="11" font-weight="400" fill="#332A23" fill-opacity="1">embedding (on device)</text><text x="360" y="241" text-anchor="middle" font-size="10" font-weight="400" fill="#332A23" fill-opacity="0.7">moments: a range, never a point</text><rect x="20" y="52" width="150" height="56" rx="8" fill="none" stroke="#332A23"/><text x="95" y="77" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Tellings</text><text x="95" y="92" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">audio spans in sessions</text><rect x="20" y="152" width="150" height="56" rx="8" fill="none" stroke="#C8893F"/><text x="95" y="177" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Entity</text><text x="95" y="192" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">person · place · thing · idea</text><rect x="20" y="252" width="150" height="56" rx="8" fill="none" stroke="#332A23"/><text x="95" y="277" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Domain tags</text><text x="95" y="292" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">free text, no fixed list</text><rect x="550" y="52" width="150" height="56" rx="8" fill="none" stroke="#C8893F"/><text x="625" y="77" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Story</text><text x="625" y="92" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">related moments</text><rect x="550" y="152" width="150" height="56" rx="8" fill="none" stroke="#332A23"/><text x="625" y="177" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Chapter</text><text x="625" y="192" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">titled by the person</text><rect x="550" y="252" width="150" height="56" rx="8" fill="none" stroke="#C8893F"/><text x="625" y="277" text-anchor="middle" font-size="12" fill="#332A23" font-weight="600">Collection</text><text x="625" y="292" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".72">a theme across chapters</text><g stroke="#332A23" stroke-width="1.3" fill="none" marker-end="url(#am2)"><path d="M240 126 H205 V80 H172"/><line x1="240" y1="180" x2="172" y2="180"/><path d="M240 234 H205 V280 H172"/><path d="M480 126 H515 V80 H548"/><line x1="480" y1="180" x2="548" y2="180"/><path d="M480 234 H515 V280 H548"/><path d="M400 256 V300 H320 V258"/></g><g font-size="9.5" fill="#332A23" fill-opacity=".75" text-anchor="middle"><text x="205" y="72">told in (1+)</text><text x="205" y="172">links (0+)</text><text x="205" y="296">tagged (0+)</text><text x="515" y="72">in (0–1)</text><text x="515" y="172">in (0–1)</text><text x="515" y="296">member (0+)</text><text x="360" y="318" font-size="10">anchor: before · after · during · same year as · age · stated</text></g><text x="360" y="352" text-anchor="middle" font-size="10" fill="#332A23" fill-opacity=".6">Also stored: sessions, segments, words, candidates (never edited), mentions, person records, curiosity items, duplicate pairs</text></svg>