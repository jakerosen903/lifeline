<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Data model on a grid: Moment at the center with fields title, quote, earliest, latest, likely, confidence; orthogonal links to Source, Person and Place on the left and Story, Chapter, Collection and Photo on the right; a loop below Moment for relative anchors (before, after, during).">
  <defs><marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#332A23"/></marker></defs>
  <g font-size="12" fill="#332A23" font-family="Inter, system-ui, sans-serif">
    <rect x="260" y="120" width="200" height="130" rx="10" fill="#5F7046" fill-opacity=".14" stroke="#5F7046" stroke-width="1.5"/>
    <text x="360" y="142" text-anchor="middle" font-weight="600" font-size="14">Moment</text>
    <text x="360" y="162" text-anchor="middle" font-size="11">title · quote</text>
    <text x="360" y="178" text-anchor="middle" font-size="11">earliest · latest · likely</text>
    <text x="360" y="194" text-anchor="middle" font-size="11">confidence · origin · visibility</text>
    <text x="360" y="210" text-anchor="middle" font-size="11">themes (joy, loss, turning point)</text>
    <text x="360" y="230" text-anchor="middle" font-size="10" fill-opacity=".7">a range, never a point · a draft until kept</text>
    <rect x="30" y="60" width="150" height="56" rx="10" fill="none" stroke="#332A23"/>
    <text x="105" y="82" text-anchor="middle" font-weight="600">Source</text>
    <text x="105" y="100" text-anchor="middle" font-size="11">audio span · transcript span · session</text>
    <rect x="30" y="152" width="150" height="56" rx="10" fill="none" stroke="#332A23"/>
    <text x="105" y="174" text-anchor="middle" font-weight="600">Person</text>
    <text x="105" y="192" text-anchor="middle" font-size="11">name · aliases · contact link</text>
    <rect x="30" y="244" width="150" height="56" rx="10" fill="none" stroke="#332A23"/>
    <text x="105" y="266" text-anchor="middle" font-weight="600">Place</text>
    <text x="105" y="284" text-anchor="middle" font-size="11">name · optional coordinates</text>
    <rect x="540" y="14" width="150" height="56" rx="10" fill="#C8893F" fill-opacity=".14" stroke="#C8893F"/>
    <text x="615" y="36" text-anchor="middle" font-weight="600">Story</text>
    <text x="615" y="54" text-anchor="middle" font-size="11">related moments · across sessions</text>
    <rect x="540" y="106" width="150" height="56" rx="10" fill="none" stroke="#332A23"/>
    <text x="615" y="128" text-anchor="middle" font-weight="600">Chapter</text>
    <text x="615" y="146" text-anchor="middle" font-size="11">person's own title · may overlap</text>
    <rect x="540" y="198" width="150" height="56" rx="10" fill="none" stroke="#C8893F"/>
    <text x="615" y="220" text-anchor="middle" font-weight="600">Collection</text>
    <text x="615" y="238" text-anchor="middle" font-size="11">a theme across chapters</text>
    <rect x="540" y="290" width="150" height="56" rx="10" fill="none" stroke="#332A23" stroke-dasharray="4 3"/>
    <text x="615" y="312" text-anchor="middle" font-weight="600">Photo (Phase 1.5)</text>
    <text x="615" y="330" text-anchor="middle" font-size="11">one photo, one story</text>
  </g>
  <g stroke="#332A23" stroke-width="1.3" fill="none" marker-end="url(#arrowD)">
    <path d="M260 140 H220 V88 H182"/>
    <line x1="260" y1="180" x2="182" y2="180"/>
    <path d="M260 220 H220 V272 H182"/>
    <path d="M460 140 H500 V42 H538"/>
    <path d="M460 165 H515 V134 H538"/>
    <path d="M460 205 H515 V226 H538"/>
    <path d="M460 230 H500 V318 H538"/>
    <path d="M400 250 V280 H320 V252"/>
  </g>
  <g font-size="10" fill="#332A23" fill-opacity=".75" font-family="Inter, system-ui, sans-serif">
    <text x="226" y="114" text-anchor="start">came from (1+)</text>
    <text x="221" y="172" text-anchor="middle">present (0+)</text>
    <text x="226" y="252" text-anchor="start">at (0–1)</text>
    <text x="494" y="60" text-anchor="end">in a story (0–1)</text>
    <text x="494" y="128" text-anchor="end">in (0–1)</text>
    <text x="494" y="246" text-anchor="end">member of (0+)</text>
    <text x="494" y="336" text-anchor="end">shown by (0+)</text>
    <text x="360" y="298" text-anchor="middle">relative anchor: before · after · during · same trip</text>
  </g>
</svg>